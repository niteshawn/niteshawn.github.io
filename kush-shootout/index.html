// characters : id -> { name, color (jacket), skin }          "narrator" has no portrait
// enemyTypes : id -> { label, hp, color, aim:[min,max] s, shots:[min,max], dmg, acc 0..1, score, scale?, burst? }
// levels[]   : { name, chapters[] }
// chapter    : { title, player (character id), scene, cover, kills, maxActive, spawnEvery:[min,max],
//                roster:{ typeId: weight }, civilians 0..1, pickups 0..1, difficulty (aim-time multiplier, <1 harder),
//                boss? (enemy type id, after kills), intro[] / outro[]: { who, text } }

const COLOR = /^#[0-9a-fA-F]{6}$/;
const range = (v) => Array.isArray(v) && v.length === 2 && v.every(Number.isFinite) && v[0] > 0 && v[0] <= v[1];

/** Every problem with a story, as readable strings; an empty list means it is playable. */
function validateStory(story, sceneIds = [], coverIds = []) {
  const errs = [];
  const err = (where, what) => errs.push(`${where}: ${what}`);
  if (!story || typeof story !== 'object') return ['story: not an object'];
  if (typeof story.title !== 'string' || !story.title) err('title', 'missing');
  const chars = story.characters || {};
  if (!Object.keys(chars).length) err('characters', 'none');
  for (const [id, c] of Object.entries(chars)) {
    if (typeof c?.name !== 'string') err(`characters.${id}.name`, 'not a string');
    if (!COLOR.test(c?.color)) err(`characters.${id}.color`, 'not #rrggbb');
    if (!COLOR.test(c?.skin)) err(`characters.${id}.skin`, 'not #rrggbb');
  }
  const types = story.enemyTypes || {};
  if (!Object.keys(types).length) err('enemyTypes', 'none');
  for (const [id, t] of Object.entries(types)) {
    const at = `enemyTypes.${id}`;
    if (!(Number.isInteger(t?.hp) && t.hp > 0)) err(`${at}.hp`, 'not a positive integer');
    if (!COLOR.test(t?.color)) err(`${at}.color`, 'not #rrggbb');
    if (!range(t?.aim)) err(`${at}.aim`, 'not [min,max] seconds');
    if (!range(t?.shots) || !t.shots.every(Number.isInteger)) err(`${at}.shots`, 'not [min,max] integers');
    if (!(Number.isFinite(t?.dmg) && t.dmg > 0)) err(`${at}.dmg`, 'not positive');
    if (!(Number.isFinite(t?.acc) && t.acc >= 0 && t.acc <= 1)) err(`${at}.acc`, 'not 0..1');
    if (!(Number.isFinite(t?.score) && t.score >= 0)) err(`${at}.score`, 'not a score');
    if (t?.burst !== undefined && !(Number.isInteger(t.burst) && t.burst >= 1 && t.burst <= 10)) err(`${at}.burst`, 'not 1..10');
  }
  if (!Array.isArray(story.levels) || !story.levels.length) err('levels', 'none');
  (story.levels || []).forEach((lv, li) => {
    if (typeof lv?.name !== 'string') err(`levels[${li}].name`, 'missing');
    if (!Array.isArray(lv?.chapters) || !lv.chapters.length) err(`levels[${li}].chapters`, 'none');
    (lv?.chapters || []).forEach((ch, ci) => {
      const at = `levels[${li}].chapters[${ci}]`;
      if (!chars[ch?.player] || ch.player === 'narrator') err(`${at}.player`, `unknown character "${ch?.player}"`);
      if (sceneIds.length && !sceneIds.includes(ch?.scene)) err(`${at}.scene`, `unknown scene "${ch?.scene}"`);
      if (coverIds.length && !coverIds.includes(ch?.cover)) err(`${at}.cover`, `unknown cover "${ch?.cover}"`);
      if (!(Number.isInteger(ch?.kills) && ch.kills > 0)) err(`${at}.kills`, 'not a positive integer');
      if (!(Number.isInteger(ch?.maxActive) && ch.maxActive > 0)) err(`${at}.maxActive`, 'not a positive integer');
      if (!range(ch?.spawnEvery)) err(`${at}.spawnEvery`, 'not [min,max] seconds');
      const roster = ch?.roster || {};
      if (!Object.keys(roster).length) err(`${at}.roster`, 'empty');
      for (const [k, w] of Object.entries(roster)) {
        if (!types[k]) err(`${at}.roster.${k}`, 'unknown enemy type');
        if (!(Number.isFinite(w) && w > 0)) err(`${at}.roster.${k}`, 'weight not positive');
      }
      for (const p of ['civilians', 'pickups']) if (ch?.[p] !== undefined && !(ch[p] >= 0 && ch[p] <= 1)) err(`${at}.${p}`, 'not 0..1');
      if (ch?.difficulty !== undefined && !(ch.difficulty > 0)) err(`${at}.difficulty`, 'not positive');
      if (ch?.boss !== undefined && !types[ch.boss]) err(`${at}.boss`, 'unknown enemy type');
      for (const part of ['intro', 'outro']) {
        if (ch?.[part] === undefined) continue;
        if (!Array.isArray(ch[part])) err(`${at}.${part}`, 'not a list');
        else ch[part].forEach((l, i) => {
          if (!chars[l?.who]) err(`${at}.${part}[${i}].who`, `unknown character "${l?.who}"`);
          if (typeof l?.text !== 'string' || !l.text) err(`${at}.${part}[${i}].text`, 'missing');
        });
      }
    });
  });
  return errs;
}

return { STORY, validateStory };

function drawOcc(c, o) {
  const { x, y, w, h, kind } = o;

  } else if (kind === 'column') {
    const g = c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#bdb7a6'); g.addColorStop(0.5, '#f3efe3'); g.addColorStop(1, '#a8a292');
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.fillStyle = '#d7d0be';
    c.fillRect(x - w * 0.1, y, w * 1.2, h * 0.04);
    c.fillRect(x - w * 0.1, y + h * 0.96, w * 1.2, h * 0.04);
  } else if (kind === 'hedge' || kind === 'bush') {
    c.fillStyle = '#1b4a22'; c.fillRect(x, y + 10, w, h - 10);
    c.fillStyle = '#235a2b';

  } else if (kind === 'trunk') {

    c.fillStyle = '#1c2230';

    c.fillStyle = '#4a6a8a'; c.fillRect(x + 100, y - 40, 55, 34); c.fillRect(x + 165, y - 40, 55, 34);

/** A placeholder person, feet at (x, y). o: { body, skin, mask, gun, aim 0..1, flash, handsUp } */

    c.fillRect(-23, -214, 46, 10);
    c.fillStyle = '#fff';
    c.fillRect(-12, -212, 7, 4); c.fillRect(5, -212, 7, 4);

    c.fillStyle = '#222';

  } else if (o.gun) {
    const aim = o.aim || 0;
    c.fillStyle = o.body; c.fillRect(-30, -170, 60, 18);
    c.fillStyle = '#0c0c0c'; c.fillRect(-14, -178, 28, 28);

function drawBust(c, x, y, ch) {
  c.save();
  c.beginPath(); c.rect(x, y, 110, 110); c.clip();
  c.fillStyle = '#1a1f2b'; c.fillRect(x, y, 110, 110);

  c.fillStyle = ch.skin; c.beginPath(); c.arc(x + 55, y + 48, 26, 0, 7); c.fill();
  c.fillStyle = '#222'; c.fillRect(x + 44, y + 44, 6, 5); c.fillRect(x + 60, y + 44, 6, 5);

/** The player's own cover across the bottom of the screen; top is its upper edge (lower when exposed). */
function drawCover(c, kind, top) {
  if (kind === 'desk') {
    c.fillStyle = '#6b4524'; c.fillRect(0, top, W, H - top + 300);

    c.fillStyle = g; c.fillRect(60, top, W - 120, H - top + 300);

  } else {
    c.fillStyle = '#2a3142'; c.fillRect(0, top, W, H - top + 300);

}

function drawCrosshair(c, x, y, color, r = 14, lw = 2) {
  c.strokeStyle = color;
  c.lineWidth = lw;
  c.beginPath();
  c.arc(x, y, r, 0, 7);
  const a = r * 1.7;
  const b = r * 0.57;
  c.moveTo(x - a, y); c.lineTo(x - b, y);
  c.moveTo(x + b, y); c.lineTo(x + a, y);
  c.moveTo(x, y - a); c.lineTo(x, y - b);
  c.moveTo(x, y + b); c.lineTo(x, y + a);
  c.stroke();
}

function panel(c, t, title, sub, lines = []) {
  c.fillStyle = 'rgba(5,7,12,.8)';
  c.fillRect(0, 0, W, H);
  c.textAlign = 'center';
  c.fillStyle = '#ffd34d';

  lines.forEach((l, i) => c.fillText(l, W / 2, 200 + i * 32));

    c.font = '16px system-ui, sans-serif';
    c.fillStyle = `rgba(255,255,255,${0.55 + 0.35 * Math.sin(t * 4)})`;
    c.fillText(sub, W / 2, H - 50);
  }
}

/** A table of players by score: rows of { name, color, score, st, me, down }. */
function scoreboard(c, rows, y0) {
  const sorted = [...rows].sort((a, b) => b.score - a.score);
  const cols = sorted.length > 8 ? 2 : 1;
  const per = Math.ceil(sorted.length / cols);
  const colW = cols === 2 ? 430 : 560;
  sorted.forEach((p, i) => {
    const col = Math.floor(i / per);
    const row = i % per;
    const x = cols === 2 ? 40 + col * 450 : (W - colW) / 2;
    const y = y0 + row * 26;
    if (p.me) {
      c.fillStyle = 'rgba(232,195,90,.15)';
      c.fillRect(x - 6, y - 18, colW, 24);
    }
    c.fillStyle = p.color;
    c.beginPath(); c.arc(x + 8, y - 6, 6, 0, 7); c.fill();
    c.textAlign = 'left';
    c.font = 'bold 15px system-ui, sans-serif';
    c.fillStyle = '#fff';
    c.fillText(`${i + 1}. ${p.name}`, x + 22, y);
    c.font = '14px system-ui, sans-serif';
    c.fillStyle = '#cbd5e1';
    const acc = p.st.shots ? Math.round((100 * p.st.hits) / p.st.shots) : 0;
    c.fillText(`K ${p.st.kills}  HS ${p.st.heads}  ${acc}%`, x + colW * 0.42, y);
    c.textAlign = 'right';
    c.fillStyle = '#ffd34d';
    c.font = 'bold 15px system-ui, sans-serif';
    c.fillText(String(p.score), x + colW - 14, y);
  });
}

// ---- damage: what a prop looks like after it has been shot (the hits are { x, y, s } with s a seed), drawn clipped to the
// prop's rectangle. Holes and cracks build up; a car smokes once it is badly hit.
const CHIP = { car: '#aeb7c8', column: '#f3efe3', cabinet: '#8e949a', desk: '#b07a40', sofa: '#efe8dc', trunk: '#6b4528', bush: '#3f8a3a', hedge: '#2f7a30' };
const chipColor = (kind) => CHIP[kind] || '#bbb';
const isLeafy = (kind) => kind === 'bush' || kind === 'hedge';

function drawDamage(c, o, hits, t, art) {
  if (!hits.length) return;
  const leafy = isLeafy(o.kind);
  const glint = o.kind === 'car' ? 'rgba(215,225,240,.7)' : o.kind === 'column' ? 'rgba(255,255,255,.4)' : o.kind === 'sofa' ? 'rgba(240,230,220,.55)' : 'rgba(255,225,190,.35)';
  c.save();
  c.beginPath();
  c.rect(o.x, o.y, o.w, o.h);
  c.clip();
  if (hits.length >= 14 && !leafy) {
    c.fillStyle = 'rgba(0,0,0,.14)'; // scorched
    c.fillRect(o.x, o.y, o.w, o.h);
  }
  for (const h of hits) {
    let sd = h.s;
    const r = () => ((sd = (Math.imul(sd, 1664525) + 1013904223) >>> 0) / 4294967296);
    if (leafy) {
      c.fillStyle = 'rgba(8,20,6,.85)'; // a gap torn in the leaves
      c.beginPath(); c.ellipse(h.x, h.y, 5 + r() * 5, 4 + r() * 3, r() * 3, 0, 7); c.fill();
      c.fillStyle = 'rgba(0,0,0,.45)';
      for (let i = 0; i < 3; i++) c.fillRect(h.x + (r() - 0.5) * 16, h.y + (r() - 0.5) * 12, 2, 2);
      continue;
    }
    const rad = 2.4 + r() * 1.6;
    c.strokeStyle = 'rgba(0,0,0,.5)';
    c.lineWidth = 1;
    const n = 3 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const a = r() * 6.283, len = 7 + r() * 12;
      c.beginPath();
      c.moveTo(h.x, h.y);
      c.lineTo(h.x + Math.cos(a) * len * 0.55 + (r() - 0.5) * 4, h.y + Math.sin(a) * len * 0.55 + (r() - 0.5) * 4);
      c.lineTo(h.x + Math.cos(a) * len, h.y + Math.sin(a) * len);
      c.stroke();
    }
    if (art && art.hole(c, h)) continue; // the painted hole, when the art is there
    c.fillStyle = 'rgba(0,0,0,.88)';
    c.beginPath(); c.arc(h.x, h.y, rad, 0, 7); c.fill();
    c.strokeStyle = glint;
    c.lineWidth = 1.3;
    c.beginPath(); c.arc(h.x, h.y, rad + 1.4, 0, 7); c.stroke();
  }
  c.restore();
  if (o.kind === 'car' && hits.length >= 10 && t >= 0) {
    // smoke from under the bonnet, thicker the more it has been hit
    const puffs = Math.min(7, 3 + Math.floor((hits.length - 10) / 3));
    for (let i = 0; i < puffs; i++) {
      const p = (t * 0.45 + i / puffs) % 1;
      const px = o.x + o.w * 0.24 + Math.sin(t * 2 + i * 2.1) * 9 + p * 16, py = o.y + 4 - p * 80;
      c.globalAlpha = 0.8 * (1 - p);
      const painted = art && art.smoke(c, p, px, py);
      c.globalAlpha = 1;
      if (painted) continue;
      c.fillStyle = `rgba(120,122,128,${0.55 * (1 - p)})`;
      c.beginPath(); c.arc(px, py, 10 + p * 24, 0, 7); c.fill();
    }
  }
}

return { roundRect, wrapText, drawBackdrop, drawOcc, drawFigure, drawBust, drawCover, drawCrosshair, panel, scoreboard, chipColor, isLeafy, drawDamage };
})();

  for (const p of A.pops) p.t += dt;
  A.pops = A.pops.filter((p) => p.t < 1);
  for (const b of A.banners) b.t += dt;
  A.banners = A.banners.filter((b) => b.t < 3);
  if (A.screen !== 'game') return;
  const v = A.view;
  const me = meOf(v);
  const want = ducking() && me && !me.down && v.ph === 'play';
  A.duck = clamp(A.duck + ((want ? 1 : -1) * dt) / DUCK_S, 0, 1);
  if (v) {
    const key = v.ph === 'dialog' ? dialogKey(v) : '';
    if (key !== A.dlgKey) {
      A.dlgKey = key;
      A.dlgStart = now;
      A.dlgRevealed = false;
    }
  }
  if (A.mode === 'solo' && A.sim) {
    if (A.paused) return;
    A.sim.input(A.me, { duck: want, x: input.x, y: input.y });
    A.sim.step(dt);
    A.view = A.sim.snapshot();
    A.viewAt = now;
    handleEvents(A.sim.drain());
  } else if (A.mode === 'online' && A.net) {
    const L = A.lastSent;
    const d = want ? 1 : 0;
    const moved = Math.abs(input.x - L.x) + Math.abs(input.y - L.y) > 4;
    if (d !== L.d || (moved && now - L.at > 50)) {
      A.net.send(msg.input(d, input.x, input.y));
      Object.assign(L, { d, x: input.x, y: input.y, at: now });
    }
  }
}

function render(now) {
  ctx.save();
  if (A.shake > 0 && !REDUCED) ctx.translate(rand(-A.shake, A.shake) * 0.5, rand(-A.shake, A.shake) * 0.5);
  if (A.screen === 'invalid') renderInvalid();
  else if (A.screen === 'title') renderTitle();
  else if (A.screen === 'connecting' || (A.screen === 'game' && !A.view)) {
    drawBackdrop(ctx, 'office');
    panel(ctx, A.t, 'CONNECTING…', 'Esc to cancel', ['Joining the co-op room']);
  } else if (A.screen === 'ended') renderEnded();
  else renderGame(now);
  // the pointer is hidden over the canvas, so on a computer the crosshair is there from the first menu on, not only
  // once shooting starts (a scene draws its own, which also shows reloading)
  if (input.seen && !(A.screen === 'game' && A.view?.ph === 'play')) drawCrosshair(ctx, input.x, input.y, '#ff3b30');
  // with a mouse the keys are shown in the game itself, unless the game already prints them (its own controls)
  if (input.seen && !input.touch && !OWN_CONTROLS && A.screen === 'game') {

}

function entTime(e) {
  return A.mode === 'online' ? e.t + Math.min(0.2, (performance.now() - A.viewAt) / 1000) : e.t;
}

/** The art clip for an entity's state and how far into it, or null (no art for this slot or state). */
function artClip(e, live, now) {
  const slot = e.kind === 'civ' ? 'civilian' : e.type;
  const pick = (name, t) => (hasClip(`${slot}/${name}`) ? { key: `${slot}/${name}`, t } : null);
  const region = A.reactionZone.get(e.id) || 'chest';
  if (live.state === 'dying') return pick(`down-${region}`, live.t) || pick('down', live.t);
  const hitAgo = (now - (A.hitAt.get(e.id) || -1e9)) / 1000;
  if (hitAgo < 0.23) {
    const localized = pick(`hit-${region}`, hitAgo);
    if (localized) return localized;
    if (hitAgo < 0.1) return pick('hit', hitAgo);
  }
  switch (live.state) {
    case 'enter': return pick('enter', live.t);
    case 'exit': return pick('exit', live.t);
    case 'idle': return pick('idle', live.t);
    case 'aim': return pick('aim', live.t);
    case 'fire': {
      if (hasClip(`${slot}/burst`)) {
        const shots = story.enemyTypes[e.type]?.burst || 1;
        return pick('burst', (shots - (e.burst || 1)) * 0.18 + live.t);
      }
      return pick('fire', live.t);
    }
  }
  return null;
}

function drawEnt(e, sp, now) {
  const live = { ...e, t: entTime(e) };
  const P = pose(live, sp);
  ctx.save();
  ctx.globalAlpha = P.a;
  if (sp.type === 'rise' && sp.occ) {
    ctx.beginPath();
    ctx.rect(0, 0, W, sp.occ.y + sp.occ.h);
    ctx.clip();
  }
  if (e.kind === 'pickup') {
    const s = P.s;
    const x = P.x;
    const y = P.y - 10 * s;
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(x - 40 * s, y - 80 * s, 80 * s, 70 * s);
    ctx.fillStyle = '#d22'; ctx.fillRect(x - 8 * s, y - 72 * s, 16 * s, 54 * s); ctx.fillRect(x - 27 * s, y - 53 * s, 54 * s, 16 * s);
    ctx.restore();
    return;
  }
  // a soft shadow where they stand, so they are on the floor and not in front of it (in a dark doorway it is all that shows the floor)
  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath();
  ctx.ellipse(P.x, (sp.type === 'rise' ? sp.y : P.y) + 1, 44 * P.s, 8 * P.s, 0, 0, 7);
  ctx.fill();
  const art = artClip(e, live, now);
  if (art && drawClip(ctx, art.key, art.t, P.x, P.y, P.s)) {
    // the character's art
  } else if (e.kind === 'civ') {
    drawFigure(ctx, P.x, P.y, P.s, { body: '#e8e6df', skin: '#d9a77c', handsUp: true });
  } else {
    const T0 = story.enemyTypes[e.type];
    const aim0 = live.state === 'aim' ? clamp(live.t / (e.aimT || 1), 0, 1) : live.state === 'fire' ? 1 : 0;
    drawFigure(ctx, P.x, P.y, P.s, { body: T0.color, skin: '#c99a74', mask: true, gun: true, aim: aim0, flash: (A.flash.get(e.id) || 0) > now });
  }
  ctx.restore();
  if (e.kind === 'civ') return;
  const T = story.enemyTypes[e.type];
  const aim = live.state === 'aim' ? clamp(live.t / (e.aimT || 1), 0, 1) : live.state === 'fire' ? 1 : 0;
  if (live.state === 'aim' && aim > 0.55 && P.a > 0.5) {
    const mine = e.target === A.me;
    const hx = P.x;
    const hy = P.y - 268 * P.s;
    ctx.save();
    ctx.globalAlpha = mine ? 0.6 + 0.4 * Math.sin(A.t * 30) : 0.75;
    ctx.fillStyle = mine ? '#ff3b30' : 'rgba(255,170,60,.8)';
    const r = mine ? 16 : 10;
    ctx.beginPath(); ctx.moveTo(hx, hy - r * 1.1); ctx.lineTo(hx + r, hy + r * 0.6); ctx.lineTo(hx - r, hy + r * 0.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${mine ? 18 : 12}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('!', hx, hy + r * 0.45);
    if (!mine && A.mode === 'online') label(nameOf(e.target), hx, hy - r * 1.4, colorOf(e.target), 'center');
    ctx.restore();
  }
  if (e.kind === 'boss') {
    ctx.globalAlpha = P.a;
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(T.label, P.x, P.y - 240 * P.s);
    ctx.globalAlpha = 1;
  }
}

/** A small name tag, outlined so it reads on any background. */
function label(text, x, y, color, align) {
  ctx.font = 'bold 12px system-ui, sans-serif';
  ctx.textAlign = align;
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function renderWorld(v, now) {
  const ch = chapterOf(v);
  const sps = SCENES[ch.scene].spawns;
  drawBackdrop(ctx, ch.scene);
  drawFixtures(ctx, ch.scene, A.fix, A.t, REDUCED);
  const order = sps.map((sp, i) => i).sort((a, b) => sps[a].s - sps[b].s);
  for (const i of order) {
    const e = v.ents.find((x) => x.sp === i);
    if (e) drawEnt(e, sps[i], now);
    if (sps[i].occ) {
      drawOcc(ctx, sps[i].occ, ch.scene, sps[i].id);
      const d = A.dmg.get(i);
      if (d) {
        drawDamagedProp(ctx, ch.scene, sps[i].id, sps[i].occ, d, A.t, REDUCED);
        drawDamage(ctx, sps[i].occ, d.hits, REDUCED ? -1 : A.t, PAINTED_DAMAGE(sps[i].occ.kind)); // no smoke or flying chips with reduced motion; the holes stay
      }
    }
  }
  // teammates' crosshairs
  if (A.mode === 'online' && v.ph === 'play') {
    for (const p of v.players) {
      if (p.id === A.me || p.down || p.duck > 0.5) continue;
      drawCrosshair(ctx, p.x, p.y, p.color, 9, 1.5);
      label(p.name, p.x + 12, p.y - 10, p.color, 'left');
    }
  }
  for (const f of A.fx) {
    const k = f.small ? 0.6 : 1;
    if (f.kind === 'spark') {
      ctx.fillStyle = f.color || `rgba(255,220,120,${1 - f.t / 0.35})`;
      ctx.globalAlpha = 1 - f.t / 0.35;
      for (let i = 0; i < 5; i++) ctx.fillRect(f.x + rand(-10, 10) * k, f.y + rand(-10, 10) * k, 3, 3);
      ctx.globalAlpha = 1;
    } else if (f.kind === 'shard') {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.8);
      drawFx(ctx, 'shards-glass', f.frame, f.x + f.vx * f.t, f.y + f.vy * f.t + 520 * f.t * f.t, 0.7, f.rot + f.spin * f.t);
      ctx.globalAlpha = 1;
    } else if (f.kind === 'chip') {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.8);
      ctx.fillStyle = chipColor(f.pk);
      const cx = f.x + f.vx * f.t, cy = f.y + f.vy * f.t + 520 * f.t * f.t;
      const sheet = chipSheet(f.pk);
      if (sheet && drawFx(ctx, sheet, f.frame, cx, cy, 0.6, f.rot + f.spin * f.t)) { /* painted debris */ } else if (isLeafy(f.pk)) { ctx.beginPath(); ctx.ellipse(cx, cy, 4, 2.2, f.t * 9, 0, 7); ctx.fill(); } else ctx.fillRect(cx, cy, 3, 3);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = `rgba(20,20,20,${1 - f.t / 0.6})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 4 * k, 0, 7); ctx.fill();
    }
  }
  for (const p of A.pops) {
    ctx.globalAlpha = 1 - p.t;
    ctx.font = `bold ${p.size}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.strokeText(p.text, p.x, p.y - p.t * 40);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.t * 40);
    ctx.globalAlpha = 1;
  }
  // own gun and cover
  const me = meOf(v);
  const top = coverTop(A.duck);
  const handsArt = me && !me.down && (v.ph === 'play' || v.ph === 'over') && isReady('hands/idle');
  if (me && !me.down && !handsArt && A.duck < 0.98 && (v.ph === 'play' || v.ph === 'over')) {
    const gx = 640 + (input.x - 480) * 0.22;
    const gy = top - 6 + A.recoil * 18 + A.duck * 260;
    const ang = Math.atan2(input.y - gy, input.x - gx) + Math.PI / 2;
    const pc = story.characters[ch.player];
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(clamp(ang, -0.7, 0.7));
    ctx.fillStyle = pc.color; ctx.fillRect(-22, 10, 44, 90);
    ctx.fillStyle = pc.skin; ctx.beginPath(); ctx.arc(0, 8, 18, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b1b1f'; ctx.fillRect(-9, -70, 18, 80);
    ctx.fillStyle = '#2c2c33'; ctx.fillRect(-11, -74, 22, 40);
    if (A.muzzle > 0) {
      ctx.fillStyle = 'rgba(255,220,110,.95)'; ctx.beginPath(); ctx.arc(0, -84, 22, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -84, 10, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  if (!drawCoverArt(ctx, ch.scene, top, W, H)) drawCover(ctx, ch.cover, top); // the painted scene's own ledge when it has loaded
  if (handsArt && A.duck < 0.98) drawHands(me);
  if (A.duck > 0.6 && v.ph === 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(0, top, W, H - top);
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(me && me.rl > 0 ? 'RELOADING…' : 'IN COVER', W / 2, top + 70);
  }
  if (A.hurtFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 560);
    g.addColorStop(0, 'rgba(200,0,0,0)');
    g.addColorStop(0.5, 'rgba(200,0,0,0)');
    g.addColorStop(1, `rgba(200,0,0,${A.hurtFlash * 0.9})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  if (me && !me.down && me.hp < 30 && v.ph === 'play') {
    ctx.fillStyle = `rgba(150,0,0,${0.12 + 0.08 * Math.sin(A.t * 6)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/** The player's own hands and pistol (art), in front of the cover, following the crosshair and dropping with a duck. */
function drawHands(me) {
  let key = 'hands/idle';
  let t = A.t;
  if (me.rl > 0 && hasClip('hands/reload')) {
    key = 'hands/reload';
    t = clamp(RELOAD_S - me.rl, 0, RELOAD_S);
  } else if (performance.now() - A.dryAt < 100 && hasClip('hands/dry')) {
    key = 'hands/dry';
    t = 0;
  } else if (A.muzzle > 0 && hasClip('hands/fire')) {
    key = 'hands/fire';
    t = (0.06 - A.muzzle) * 2;
  }
  const s = 0.9;
  const gx = 480 + (input.x - 480) * 0.35;
  const gy = H + 8 + A.recoil * 14 + A.duck * 260;
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(clamp((input.x - gx) / 900, -0.22, 0.22));
  drawClip(ctx, key, t, 0, 0, s, { feet: 240 });
  if (A.muzzle > 0) {
    ctx.fillStyle = 'rgba(255,220,110,.9)';
    ctx.beginPath(); ctx.arc(-5 * s, -232 * s, 18, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function renderHUD(v) {
  const ch = chapterOf(v);
  const me = meOf(v);
  if (!me) return;
  const pc = story.characters[ch.player];
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(ctx, 14, 12, 270, 46, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(A.mode === 'online' ? `${pc.name} · ${me.name}` : pc.name, 26, 30);
  ctx.fillStyle = '#3a1414'; ctx.fillRect(26, 38, 246, 10);
  ctx.fillStyle = me.hp > 50 ? '#4ade80' : me.hp > 25 ? '#facc15' : '#ef4444';
  ctx.fillRect(26, 38, (246 * me.hp) / MAX_HP, 10);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(ctx, W / 2 - 110, 12, 220, 46, 8); ctx.fill();
  ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.fillText(String(me.score).padStart(6, '0'), W / 2, 44);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(ctx, W - 214, 12, 200, 46, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'right';

    ctx.fillStyle = '#3a1414'; ctx.fillRect(W - 200, 38, 174, 10);

  } else {
    ctx.fillText('TARGETS LEFT', W - 26, 30);
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#ff8a80';
    ctx.fillText(String(Math.max(0, v.kt - v.k)), W - 26, 52);
  }
  // squad roster
  if (A.mode === 'online' && v.players.length > 1) {
    const rows = v.players;
    const h = 16;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    roundRect(ctx, W - 170, 66, 156, rows.length * h + 10, 6);
    ctx.fill();
    rows.forEach((p, i) => {
      const y = 82 + i * h;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(W - 158, y - 4, 4, 0, 7); ctx.fill();
      ctx.textAlign = 'left';
      ctx.font = `${p.id === A.me ? 'bold ' : ''}11px system-ui, sans-serif`;
      ctx.fillStyle = p.down ? '#94a3b8' : '#fff';
      ctx.fillText(p.name, W - 148, y);
      if (p.down) {
        ctx.fillStyle = '#ff8a80';
        ctx.fillText('DOWN', W - 70, y);
      } else {
        ctx.fillStyle = '#3a1414'; ctx.fillRect(W - 80, y - 8, 46, 5);
        ctx.fillStyle = p.hp > 50 ? '#4ade80' : p.hp > 25 ? '#facc15' : '#ef4444';
        ctx.fillRect(W - 80, y - 8, (46 * p.hp) / MAX_HP, 5);
        if (p.duck > 0.5) {
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(W - 28, y - 9, 8, 7);
        }
      }
    });
  }
  if (me.down) return;
  const ax = input.touch && OWN_CONTROLS ? 170 : 24;
  const ay = H - 34;
  for (let i = 0; i < MAG; i++) {
    ctx.fillStyle = i < me.ammo ? '#e8c35a' : 'rgba(255,255,255,.18)';
    roundRect(ctx, ax + i * 16, ay, 10, 24, 4);
    ctx.fill();
  }
  if (me.ammo === 0 && me.rl <= 0) {
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('RELOAD! (R)', ax + MAG * 16 + 10, ay + 18);
  }
  if (!OWN_CONTROLS) {
    // the host's controls are the console: nothing to explain or press on the screen
  } else if (!input.touch) {
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('SPACE or click = fire · hold C or SHIFT (or the mouse at the bottom edge) = cover · R = reload', W - 16, H - 12);
  } else {
    const b = BTN.duck;
    ctx.fillStyle = ducking() ? 'rgba(94,234,138,.55)' : 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('COVER', b.x, b.y + 6);
    const r = BTN.reload;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText('RELOAD', r.x, r.y + 6);
  }
  if (A.duck < 0.5 && v.ph === 'play' && (!input.touch || !OWN_CONTROLS || A.muzzle > 0)) {
    drawCrosshair(ctx, input.x, input.y, me.rl > 0 ? 'rgba(255,255,255,.4)' : '#ff3b30');
    if (me.rl > 0) {
      ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(input.x, input.y, 20, -Math.PI / 2, -Math.PI / 2 + (1 - me.rl / RELOAD_S) * Math.PI * 2);
      ctx.stroke();
    }
  }
}

function readyLine(v) {
  if (A.mode !== 'online') return '';
  const n = v.players.length;
  const r = v.players.filter((p) => p.ready).length;
  return n > 1 ? `${r}/${n} ready` : '';
}

function renderGame(now) {
  const v = A.view;
  const me = meOf(v);
  if (v.ph === 'lobby') return renderLobby(v);
  renderWorld(v, now);
  if (v.ph === 'play' || v.ph === 'over') renderHUD(v);
  // banners (joins, downs)
  A.banners.forEach((b, i) => {
    ctx.globalAlpha = Math.min(1, 3 - b.t);
    ctx.fillStyle = b.color;
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(b.text, 20, 86 + i * 20);
    ctx.globalAlpha = 1;
  });
  const lv = story.levels[v.li];
  const ch = chapterOf(v);
  if (v.ph === 'play' && me?.down) {
    ctx.fillStyle = 'rgba(20,20,30,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff8a80';
    ctx.font = 'bold 40px system-ui, sans-serif';
    ctx.fillText("YOU'RE DOWN", W / 2, H / 2 - 10);
    ctx.fillStyle = '#e5e7eb';
    ctx.font = '18px system-ui, sans-serif';
    const up = v.players.filter((p) => !p.down).length;
    ctx.fillText(`Spectating · ${up} still fighting · back next chapter`, W / 2, H / 2 + 24);
  }
  if (v.ph === 'card') {
    ctx.fillStyle = 'rgba(0,0,0,.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd34d'; ctx.font = 'bold 40px system-ui, sans-serif'; ctx.fillText(lv.name, W / 2, H / 2 - 20);
    ctx.fillStyle = '#e5e7eb'; ctx.font = '22px system-ui, sans-serif';
    ctx.fillText(`Chapter ${v.ci + 1}: ${ch.title}  ·  ${story.characters[ch.player].name}`, W / 2, H / 2 + 24);
    if (A.mode === 'online') {
      ctx.font = '15px system-ui, sans-serif'; ctx.fillStyle = '#94a3b8';
      ctx.fillText(`${v.players.length} in the squad`, W / 2, H / 2 + 60);
    }
  } else if (v.ph === 'dialog') renderDialog(v, now);
  else if (v.ph === 'clear') {
    panel(ctx, A.t, 'CHAPTER CLEAR', `Tap to continue ${readyLine(v) ? '· ' + readyLine(v) : ''}`, A.mode === 'solo' ? soloStats(me) : []);
    if (A.mode === 'online') scoreboard(ctx, v.players.map((p) => ({ ...p, me: p.id === A.me })), 200);
  } else if (v.ph === 'over') {
    panel(ctx, A.t, A.mode === 'online' && v.players.length > 1 ? 'SQUAD DOWN' : 'YOU WENT DOWN', 'Restarting the chapter…', [`${ch.title} — scores go back to the chapter start`]);
  } else if (v.ph === 'win') {
    drawBackdrop(ctx, 'exterior');
    panel(ctx, A.t, 'MISSION COMPLETE', `Tap to ${A.mode === 'online' ? 'return to the lobby' : 'play again'} ${readyLine(v) ? '· ' + readyLine(v) : ''}`, A.mode === 'solo' ? [`Final score ${me?.score ?? 0}`] : []);
    if (A.mode === 'online') scoreboard(ctx, v.players.map((p) => ({ ...p, me: p.id === A.me })), 200);
  }
  if (A.paused) panel(ctx, A.t, 'PAUSED', 'Tap or press Esc to resume');
}

function soloStats(me) {
  if (!me) return [];
  const s = me.st;
  const acc = s.shots ? Math.round((100 * s.hits) / s.shots) : 0;
  return [`Kills ${s.kills}   ·   Headshots ${s.heads}`, `Accuracy ${acc}%   ·   Civilians hit ${s.civ}`, `Health remaining ${Math.ceil(me.hp)}`, `Score ${me.score}`];
}

function renderLobby(v) {
  drawBackdrop(ctx, chapterOf(v).scene);
  ctx.fillStyle = 'rgba(5,7,12,.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd34d';
  ctx.font = 'bold 40px system-ui, sans-serif';
  ctx.fillText('CO-OP LOBBY', W / 2, 80);
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText(`Room ${A.room} · ${v.players.length}/16 players`, W / 2, 112);
  v.players.forEach((p, i) => {
    const col = i < 8 ? 0 : 1;
    const row = i % 8;
    const x = W / 2 - 300 + col * 320;
    const y = 160 + row * 30;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x + 10, y - 6, 8, 0, 7); ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = `${p.id === A.me ? 'bold ' : ''}18px system-ui, sans-serif`;
    ctx.fillText(p.id === A.me ? `${p.name} (you)` : p.name, x + 28, y);
  });
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = `rgba(255,211,77,${0.6 + 0.4 * Math.sin(A.t * 4)})`;
  ctx.fillText('TAP TO START FOR EVERYONE', W / 2, H - 60);
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('Anyone can start. Players can join mid-game. Esc to leave.', W / 2, H - 34);
}

function renderDialog(v, now) {
  const line = chapterOf(v)[v.part]?.[v.di];
  if (!line) return;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, H);
  const ch = story.characters[line.who] || story.characters.narrator;
  const bx = 40;
  const by = H - 170;
  const bw = W - 80;
  const bh = 140;
  ctx.fillStyle = 'rgba(10,13,20,.94)';
  roundRect(ctx, bx, by, bw, bh, 12);
  ctx.fill();
  ctx.strokeStyle = '#e8c35a';
  ctx.lineWidth = 2;
  ctx.stroke();
  const narr = line.who === 'narrator' || !ch?.name;
  let tx = bx + 24;
  if (!narr) {
    const typing = !A.dlgRevealed && ((now - A.dlgStart) / 1000) * 45 < line.text.length;
    const pkey = `${line.who}/portrait-${typing ? 'talk' : 'idle'}`;
    ctx.save();
    ctx.beginPath(); ctx.rect(bx + 16, by + 15, 110, 110); ctx.clip();
    ctx.fillStyle = '#1a1f2b'; ctx.fillRect(bx + 16, by + 15, 110, 110);
    const drawn = drawClipCrop(ctx, pkey, A.t, [58, 4, 140, 140], bx + 16, by + 15, 110, 110);
    ctx.restore();
    if (drawn) {
      ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 3; ctx.strokeRect(bx + 16, by + 15, 110, 110);
    } else drawBust(ctx, bx + 16, by + 15, ch);
    tx = bx + 146;
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(ch.name, tx, by + 36);
  }
  const shown = A.dlgRevealed ? line.text : line.text.slice(0, Math.floor(((now - A.dlgStart) / 1000) * 45));
  ctx.fillStyle = narr ? '#cbd5e1' : '#fff';
  ctx.font = `${narr ? 'italic ' : ''}19px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  wrapText(ctx, shown, tx, by + (narr ? 50 : 66), bw - (tx - bx) - 30, 26);
  ctx.textAlign = 'right';
  ctx.font = '13px system-ui, sans-serif';
  const waiting = A.sentReady === dialogKey(v);
  ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(A.t * 5)})`;
  ctx.fillText(waiting ? `✓ waiting · ${readyLine(v)}` : `tap ▸ ${readyLine(v)}`, bx + bw - 16, by + bh - 12);
}

// ---------- the host page (embed=1) ----------
// Messages from the parent window only: { ks: 'aim', x, y } (0..1 across the screen), 'fire', 'cover' { on },
// 'reload', 'next', 'solo', 'coop', 'exit', 'mute' { on }. FIRE on a menu screen moves it on, like a tap.
function onHostMessage(e) {
  if (!EMBED || e.source !== window.parent) return;
  const m = e.data;
  if (!m || typeof m !== 'object' || typeof m.ks !== 'string') return;
  audioInit();
  const playing = A.screen === 'game' && A.view?.ph === 'play' && !A.paused;
  switch (m.ks) {
    case 'aim':
      if (Number.isFinite(m.x) && Number.isFinite(m.y)) {
        input.x = clamp(m.x, 0, 1) * W;
        input.y = clamp(m.y, 0, 1) * H;
      }
      break;
    case 'fire':
      if (playing) tryFire(input.x, input.y);
      else tap({ x: W / 2, y: H / 2 });
      break;
    case 'cover':
      input.hostDuck = !!m.on;
      break;
    case 'reload':
      if (playing) act.reload();
      break;
    case 'next':
      if (!playing) tap({ x: W / 2, y: H / 2 });
      break;
    case 'solo':
      quitToTitle();
      startSolo();
      break;
    case 'coop':
      if (!URL_) break;
      quitToTitle();
      startOnline();
      break;
    case 'exit':
      quitToTitle();
      break;
    case 'mute':
      setMuted(!!m.on);
      break;
  }
}
addEventListener('message', onHostMessage);

// What the host shows on its own readouts, sent when it changes (at most ten times a second).
let lastStatus = '';
let lastStatusAt = 0;
function postStatus(now) {
  if (!EMBED || now - lastStatusAt < 100) return;
  const v = A.view;
  const me = meOf(v);
  const s = {
    ks: 'status', screen: A.screen, mode: A.mode, ph: v?.ph || '', coop: !!URL_,
    hp: me ? me.hp : null, ammo: me ? me.ammo : null, mag: MAG, reloading: !!(me && me.rl > 0), down: !!me?.down,
    ducked: A.duck > 0.5, score: me ? me.score : 0,
  };
  const text = JSON.stringify(s);
  if (text === lastStatus) return;
  lastStatus = text;
  lastStatusAt = now;
  window.parent.postMessage(s, '*'); // '*': the host may be a file:// page, whose origin is opaque; nothing here is private
}

// For tests and debugging: read-only state and the two ways in.
window.__ks = {
  get state() {
    return { screen: A.screen, mode: A.mode, me: A.me, room: A.room, view: A.view, endReason: A.endReason, server: URL_, storyErrors, aim: { x: input.x, y: input.y }, art: artStatus(), damage: Object.fromEntries([...A.dmg].map(([i, d]) => [i, d.hits.length])), broken: [...A.fix.keys()], embed: EMBED, ownControls: OWN_CONTROLS, reduced: !!REDUCED };
  },
  startSolo,
  startOnline,
};

requestAnimationFrame(frame);

return {  };
})();

</script>
